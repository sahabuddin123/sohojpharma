_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://sohojpharma_auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://sohojpharma_rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - ApiKey
        - Authorization
        - X-Client-Info
        - Prefer
        - Range
      exposed_headers:
        - Content-Range
        - Range-Unit
      credentials: true
      max_age: 3600
